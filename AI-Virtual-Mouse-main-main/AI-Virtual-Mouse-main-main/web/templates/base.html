<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}AI Virtual Mouse - Auth{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      :root{
        --bg:#f6f8fb; --card:#ffffff; --accent:#5b6cff; --muted:#6b7280;
      }
      html,body{height:100%;}
      body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial; background:var(--bg); margin:0; display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; }
      .container{width:100%; max-width:760px}
      header{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px}
      .brand{font-weight:700; color:var(--accent); font-size:18px}
      nav a, nav a:link, nav a:visited, nav a:active{
        color:#000 !important;
        text-decoration:none;
        margin-left:14px;
        display:inline-block;
        background:#fff !important;
        padding:6px 10px;
        border-radius:8px;
        box-shadow:0 4px 10px rgba(20,24,40,0.06);
        border:1px solid rgba(0,0,0,0.06);
        font-size:14px;
      }
      nav a:first-child{margin-left:0}
      nav a:hover{background:#f0f0f0; color:#111}
      @media (max-width:520px){ nav a{padding:6px 8px; margin-left:10px; font-size:13px} }
      .card{background:var(--card); border-radius:12px; box-shadow:0 6px 18px rgba(20,24,40,0.06); padding:28px}
      form{display:flex; flex-direction:column; gap:12px}
      label{font-size:13px; color:var(--muted)}
      input[type=text], input[type=password], select{padding:10px 12px; border:1px solid #e6e9ef; border-radius:8px; font-size:15px}
      button{background:var(--accent); color:white; border:none; padding:10px 14px; border-radius:8px; font-weight:600; cursor:pointer}
      .muted{color:var(--muted); font-size:14px}
      .flash{background:#fff4e6; border:1px solid #ffd6a5; padding:10px; border-radius:8px; margin-bottom:14px}
      .center{display:flex; gap:8px; align-items:center}
      @media (max-width:520px){ body{padding:20px} }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div style="display:flex;align-items:center;gap:12px">
          <img src="{{ url_for('static', filename='images/app_logo.svg') }}" alt="logo" style="width:34px;height:34px">
          <div class="brand">AI Virtual Mouse</div>
        </div>
        <nav>
          {% if session.user_id %}
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('subscribe') }}">Subscriptions</a>
            <a href="{{ url_for('logout') }}">Logout</a>
          {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('signup') }}">Sign up</a>
          {% endif %}
        </nav>
      </header>

      <!-- Background video (served from /bgvideo) -->
      <video id="bg-video" autoplay muted loop playsinline style="position:fixed;right:0;bottom:0;min-width:100%;min-height:100%;width:auto;height:auto;z-index:-1;object-fit:cover;">
        <source src="{{ url_for('bg_video') }}" type="video/mp4">
        <!-- fallback: if bg_video route missing, video won't show -->
      </video>

      <div class="card">
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for m in messages %}
              <div class="flash">{{ m }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
      </div>
    </div>
    <script type="module" src="{{ url_for('static', filename='js/firebase-init.js') }}"></script>
  </body>
</html>
